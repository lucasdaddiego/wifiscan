# Keeps the SHA-pinned actions in .github/workflows current. Package.swift has no
# dependencies, so there is no `swift` ecosystem entry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait 7 days before a version update PR (security updates ignore this).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
